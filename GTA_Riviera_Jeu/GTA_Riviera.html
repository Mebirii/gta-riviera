.mission-info em{font-style:normal;font-size:10px;color:#70ded0;font-weight:800;margin-top:3px}

.avatar.photo{overflow:hidden;padding:0;background:#122133}.avatar.photo img{width:100%;height:100%;object-fit:cover}
.actor-chip{display:flex;align-items:center;gap:5px}

function canChoose(s,id){return getScene(s).choices.find(c=>c.id===id);}
function randomRoll(){return 1+Math.floor(Math.random()*20);}
function choose(state,choiceId,actorId='gauthier',rollOverride){const s=clone(state);if(s.ended)throw Error('La partie est terminée');const c=canChoose(s,choiceId);if(!c||c.condition===false)throw Error('Action non disponible');const hero=HEROES.find(h=>h.id===actorId)||HEROES[0];let success=null,roll=null,total=null,dc=null,changes,note='';let next=c.to;
if(c.skill){roll=rollOverride===undefined?randomRoll():clamp(Math.trunc(rollOverride),1,20);dc=clamp(c.dc+(s.difficulty==='facile'?-3:s.difficulty==='difficile'?3:0),4,22);total=roll+hero.skills[c.skill];success=roll===20||roll!==1&&total>=dc;changes=success?c.success:c.failure;}

function continueCampaign(state){const s=clone(state);if(!s.ended)throw Error('Terminez la mission avant de continuer.');s.ended=false;s.scene='mission_hub';s.mission='hub';s.last=null;s.journal.unshift({title:'Nouvelle mission disponible',text:'La campagne continue. Les conséquences de vos décisions sont conservées.'});return s;}
function publicState(s){return{mission:s.mission,completed:s.completed,scene:s.scene,difficulty:s.difficulty,round:s.round,stats:s.stats,flags:s.flags,journal:s.journal,last:s.last,ended:s.ended};}

});

<div class="start-area"><button class="btn btn-primary btn-large" data-action="start">${ui.mode==='online'?(ui.onlineAction==='create'?'CRÉER LE SALON':'REJOINDRE LE SALON'):'COMMENCER L’AVENTURE'} <span>↗</span></button>${saved?'<button class="btn btn-outline" data-action="continue">↪ Reprendre la sauvegarde</button>':''}</div>${ui.error?`<p class="warning" role="alert">${h(ui.error)}</p>`:''}
</section><footer class="footer-note">GTA RIVIERA · CHAPITRE 2 — Une adaptation interactive originale de votre campagne de jeu de rôle.</footer></main>${rules()}`;}
function characterSetup(){return `<div class="characters">${E.HEROES.map(x=>`<button data-action="hero" data-value="${x.id}" class="character ${ui.hero===x.id?'selected':''}"><span class="avatar photo" style="--hero:${x.color}">${portrait(x.id)}</span><span><b>${x.name}</b><small>${x.role}</small></span><span class="character-check">${ui.hero===x.id?'●':'○'}</span></button>`).join('')}</div><p class="minor">${h(hero(ui.hero).bio)}</p>`;}

${!scene.isEnding&&ui.mode==='solo'?`<div class="actor-row"><span>Personnage actif :</span>${E.HEROES.map(x=>`<button class="actor-chip ${ui.actor===x.id?'active':''}" data-action="actor" data-value="${x.id}"><span style="background:${x.color}"></span>${x.name}</button>`).join('')}</div>`:''}
${!scene.isEnding&&ui.mode==='local'&&!ready?`<div class="vote-notice">Vote ${ui.localTurn+1}/${ui.count} — ${h(current.name)} joue ${h(roleOfVote.role)}.</div>`:''}
${!scene.isEnding&&online?`<div class="vote-notice">${ui.online?.votedCount||0} / ${ui.online?.eligibleCount||roster.length} votes reçus. ${ui.ownVote?'Vous avez voté. Vous pouvez encore changer.':'Choisissez une option.'}</div>`:''}
<div class="choices">${scene.choices.filter(c=>c.condition!==false).map((c,i)=>`<button class="choice ${online&&ui.ownVote===c.id?'chosen':''}" data-action="choice" data-value="${c.id}" ${ready?'disabled':''}><span class="choice-index">0${i+1}</span><span class="choice-body"><b>${h(c.title)}</b><small>${h(c.description)}</small>${c.skill?`<span class="skill-tag">⚄ ${h(E.SKILL_LABEL[c.skill])} · SEUIL ${c.dc+(s.difficulty==='facile'?-3:s.difficulty==='difficile'?3:0)} ${ui.mode==='solo'?`· BONUS +${roleOfVote.skills[c.skill]}`:''}</span>`:'<span class="skill-tag automatic">DÉCISION</span>'}</span><span class="choice-arrow">↗</span></button>`).join('')}</div>
${ui.mode==='local'&&ready?`<div class="resolve-panel"><div class="resolve-votes">${scene.choices.map(c=>{const n=Object.values(ui.localVotes).filter(id=>id===c.id).length;return n?`<span>${h(c.title)} <b>${n} vote${n>1?'s':''}</b></span>`:'';}).join('')}</div><button class="btn btn-primary" data-action="resolve-local">RÉSOUDRE LES VOTES ET LANCER LE DÉ ⚄</button></div>`:''}
${online&&ui.online?.isHost&&!scene.isEnding?`<div class="resolve-panel"><button class="btn btn-primary" data-action="resolve-online" ${ui.online?.votedCount!==(ui.online?.eligibleCount||roster.length)?'disabled':''}>VALIDER LE CHOIX COLLECTIF ⚄</button><small>${ui.online?.votedCount!==(ui.online?.eligibleCount||roster.length)?'En attente des votes des joueurs connectés.':'Vous pouvez valider le résultat.'}</small></div>`:''}
${scene.isEnding?`<div class="end-actions">${s.ended?'<button class="btn btn-primary" data-action="next-mission">CONTINUER LA CAMPAGNE →</button>':''}<button class="btn btn-outline" data-action="replay">REJOUER ↺</button><button class="btn btn-outline" data-action="home">RETOUR À L’ACCUEIL</button></div>`:''}
</section></div>
<aside class="sidebar"><section class="side-panel objective"><div class="eyebrow">OBJECTIF ACTUEL</div><p>${h(scene.objective)}</p><div class="progress"><span>${h((E.MISSIONS.find(m=>m.id===s.mission)||{name:"CARTE DES MISSIONS"}).name)}</span><span>ÉTAPE ${s.round+1}</span></div></section>
${online?`<section class="side-panel room-info"><div class="eyebrow">SALON EN LIGNE</div><div class="room-id">${h(ui.online?.room||'——')} <button data-action="copy-code" title="Copier le code">⧉</button></div><button class="btn btn-subtle btn-block btn-xs" data-action="copy-link">COPIER LE LIEN D’INVITATION ⧉</button><small>${ui.online?.isHost?'Vous êtes l’hôte. Vous validez les décisions.':'L’hôte valide les décisions.'} ${roster.filter(p=>!p.connected).length?'Un joueur est hors ligne et pourra revenir.':''}</small></section>`:''}
<section class="side-panel"><div class="eyebrow">L’ÉTAT DE RIVIERA</div>${miniStat('Pression / recherche',s.stats.heat,'heat')}${miniStat('Lucien / confiance',s.stats.lucien,'lucien')}${miniStat('Police / soutien',s.stats.police,'police')}${miniStat('Trésorerie',s.stats.money,'money')}${miniStat('Cohésion du groupe',s.stats.morale,'morale')}</section>
<section class="side-panel city-map"><div class="eyebrow">CARTE DE LA RIVIERA</div><div class="map-art"><img src="${asset('citymap')}" alt="Carte illustrée des quartiers de Riviera" loading="lazy"/><span class="map-label"><span class="map-pulse"></span>${h(scene.location.split(' · ')[0])}</span></div><small>${Object.keys(s.completed||{}).filter(k=>s.completed[k]).length} / 4 missions terminées · chaque quartier garde vos traces.</small></section>
<section class="side-panel"><div class="eyebrow">PIÈCES À CONVICTION</div><div class="evidence-list"><div><span>▧</span> Nérée — Volume I <b>ACQUIS</b></div><div><span>▧</span> Nérée — Volume II <b class="${s.flags.full?'ok':'pending'}">${s.flags.full?'ACQUIS':'MANQUANT'}</b></div><div><span>◷</span> Montre du Belladone <b class="${s.flags.watch?'ok':'pending'}">${s.flags.watch?'DÉTENUE':'CÉDÉE'}</b></div><div><span>✦</span> Pistes identifiées <b>${E.leads(s)}/3</b></div></div></section>
<section class="side-panel"><div class="eyebrow">L’ÉQUIPE</div><div class="crew-list">${roster.map(p=>{const x=hero(p.character);const voted=ui.mode==='online'?(ui.online?.votedIds||[]).includes(p.id):ui.mode==='local'?!!ui.localVotes[p.id]:false;return `<div class="crew-member"><span class="avatar sm photo" style="--hero:${x.color}">${portrait(x.id)}</span><span><b>${h(p.name)}</b><small>${h(x.role)}</small></span>${ui.mode!=='solo'?`<span class="member-status">${voted?'✓':'○'}</span>`:''}</div>`;}).join('')}</div></section>
<section class="side-panel"><div class="eyebrow">CARNET DE BORD</div><div class="journal">${s.journal.slice(0,5).map(j=>`<div><b>${h(j.title)}</b><p>${h(j.text)}</p></div>`).join('')}</div></section>
${!online?'<button class="btn btn-subtle btn-block" data-action="reset">↺ Nouvelle partie</button>':''}
</aside></main>${ui.notice?`<div class="toast">${h(ui.notice)}</div>`:''}${ui.error?`<div class="toast error">${h(ui.error)}</div>`:''}${rules()}`;}
function lobby(){const online=ui.online;if(!online)return menu();return `${header()}<main class="lobby"><div class="eyebrow">MULTIJOUEUR · SALON PRIVÉ</div><h1>Le groupe se rassemble.</h1><p>Partagez ce code avec les autres joueurs. Chacun choisit un personnage encore disponible, puis l’hôte commence la mission.</p><div class="big-code">${h(online.room)} <button class="btn btn-outline" data-action="copy-link">COPIER LE LIEN À PARTAGER ⧉</button></div><div class="lobby-roster">${online.players.map(p=>{const x=hero(p.character);return `<div class="lobby-player"><span class="avatar photo" style="--hero:${x.color}">${portrait(x.id)}</span><div><b>${h(p.name)}</b><small>${x.name} · ${x.role} · ${p.connected?'CONNECTÉ':'DÉCONNECTÉ'}</small></div>${p.id===online.hostId?'<span class="host-label">HÔTE</span>':''}</div>`;}).join('')}${Array.from({length:Math.max(0,4-online.players.length)},()=>'<div class="empty-player">+ EN ATTENTE D’UN JOUEUR</div>').join('')}</div>${online.isHost?`<button class="btn btn-primary btn-large" data-action="start-online" ${(online.eligibleCount||0)<2?'disabled':''}>LANCER LA MISSION ↗</button><p class="minor">${online.players.length<2?'Il faut au moins deux joueurs pour lancer une partie multijoueur.':'Tous les joueurs sont prêts à entrer dans l’histoire.'}</p>`:'<div class="vote-notice">En attente du lancement par l’hôte…</div>'}<button class="btn btn-subtle" data-action="home">Quitter le salon</button>${ui.error?`<p class="warning">${h(ui.error)}</p>`:''}</main>${rules()}`;}
function render(){app.innerHTML=ui.page==='menu'?menu():ui.page==='lobby'?lobby():play();}
function newGame(){ui.game=E.createGame(ui.difficulty,ui.selectedMission);ui.localVotes={};ui.localTurn=0;ui.actor=ui.hero;ui.page='play';ui.error='';save();render();}
function majority(votes,s){const tally={};Object.values(votes).forEach(v=>tally[v]=(tally[v]||0)+1);const max=Math.max(0,...Object.values(tally));const tied=Object.keys(tally).filter(k=>tally[k]===max);const firstVote=votes['p0'];const picked=tied.includes(firstVote)?firstVote:tied[0];const option=E.getScene(s).choices.find(c=>c.id===picked);let actors=E.HEROES.slice(0,ui.count).filter((x,i)=>votes['p'+i]===picked);actors.sort((a,b)=>(option?.skill?b.skills[option.skill]-a.skills[option.skill]:0));return{picked,actor:actors[0]?.id||'gauthier'};}
function decide(id,actor){try{ui.game=E.choose(ui.game,id,actor);ui.localVotes={};ui.localTurn=0;save();render();window.scrollTo({top:0,behavior:'smooth'});}catch(err){ui.error=err.message;render();}}
function connect(kind){if(!hasServer){ui.error='Pour jouer en ligne, utilisez le serveur inclus dans le ZIP.';render();return;}const name=ui.nickname.trim()||hero(ui.hero).name;const room=kind==='resume'?(ui.onlineSession?.room||''):ui.joinCode.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(kind==='join'&&!room){ui.error='Saisissez le code du salon.';render();return;}ui.error='';ui.notice='Connexion au salon…';render();try{ui.ws?.close();const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ui.ws=ws;ws.addEventListener('open',()=>ws.send(JSON.stringify({type:kind==='create'?'create':kind==='resume'?'resume':'join',name,character:ui.hero,room,token:ui.onlineSession?.token,difficulty:ui.difficulty,mission:ui.selectedMission})));ws.addEventListener('message',(e)=>{let msg;try{msg=JSON.parse(e.data);}catch{return;}if(msg.type==='error'){ui.error=msg.message;ui.notice='';if(kind==='resume'){ui.page='menu';ui.onlineSession=null;try{localStorage.removeItem(LS_ROOM);}catch(e){}}render();}else if(msg.type==='snapshot'){if(ui.game&&msg.data.game&&ui.game.round!==msg.data.game.round)ui.ownVote=null;ui.online={...msg.data,me:msg.data.players.find(p=>p.id===msg.data.you),isHost:msg.data.hostId===msg.data.you};ui.reconnecting=false;ui.mode='online';ui.notice='';ui.error='';if(msg.data.game){ui.game=msg.data.game;ui.page='play';}else ui.page='lobby';render();}else if(msg.type==='registered'){ui.onlineSession={token:msg.token,room:msg.room};try{localStorage.setItem(LS_ROOM,JSON.stringify(ui.onlineSession));}catch(e){}}else if(msg.type==='info'){ui.notice=msg.message;render();}});ws.addEventListener('close',()=>{if(ui.ws!==ws)return;if(ui.mode==='online'&&ui.page!=='menu'&&ui.onlineSession&&!ui.reconnecting){ui.reconnecting=true;ui.notice='Connexion perdue : reconnexion automatique…';render();setTimeout(()=>{if(ui.mode==='online'&&ui.page!=='menu'&&ui.reconnecting)connect('resume');},1800);}});ws.addEventListener('error',()=>{ui.error='Connexion impossible : vérifiez que le serveur est démarré.';ui.notice='';render();});}catch(e){ui.error=e.message;render();}}
function send(type,extra={}){if(!ui.ws||ui.ws.readyState!==WebSocket.OPEN){ui.error='Connexion au serveur indisponible.';render();return;}ui.ws.send(JSON.stringify({type,...extra}));}
function home(){if(ui.mode==='online'){ui.reconnecting=false;ui.onlineSession=null;try{localStorage.removeItem(LS_ROOM);}catch(e){}try{ui.ws?.close();}catch(e){}ui.online=null;ui.game=null;ui.ownVote=null;}ui.page='menu';ui.notice='';ui.error='';render();}
app.addEventListener('input',(ev)=>{const el=ev.target;const fld=el.dataset.field;if(!fld)return;if(fld==='nickname')ui.nickname=el.value;else if(fld==='joinCode')ui.joinCode=el.value.toUpperCase();else if(fld.startsWith('name-'))ui.names[+fld.split('-')[1]]=el.value;});
app.addEventListener('click',(ev)=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;ui.error='';if(a==='mode'){ui.mode=v;render();}else if(a==='mission'){ui.selectedMission=v;render();}else if(a==='hero'){ui.hero=v;render();}else if(a==='actor'){ui.actor=v;render();}else if(a==='difficulty'){ui.difficulty=v;render();}else if(a==='count'){ui.count=range(ui.count+parseInt(v,10),2,4);render();}else if(a==='online-action'){ui.onlineAction=v;render();}else if(a==='rules'){ui.showRules=!ui.showRules;render();}else if(a==='start'){if(ui.mode==='online')connect(ui.onlineAction);else newGame();}else if(a==='continue'){const saved=load();if(saved){Object.assign(ui,{game:saved.game,mode:saved.mode,hero:saved.hero,actor:saved.actor,names:saved.names,count:saved.count,difficulty:saved.difficulty,localVotes:saved.localVotes||{},localTurn:saved.localTurn||0,page:'play'});render();}}else if(a==='choice'){if(ui.mode==='solo')decide(v,ui.actor);else if(ui.mode==='local'){if(Object.keys(ui.localVotes).length>=ui.count)return;ui.localVotes['p'+ui.localTurn]=v;ui.localTurn++;save();render();}else{ui.ownVote=v;send('vote',{choice:v});render();}}else if(a==='resolve-local'){const {picked,actor}=majority(ui.localVotes,ui.game);decide(picked,actor);}else if(a==='resolve-online'){send('resolve');}else if(a==='start-online'){send('start');}else if(a==='copy-code'){const code=ui.online?.room||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(()=>{ui.notice='Code copié : '+code;render();}).catch(()=>{});else{ui.notice='Code du salon : '+code;render();}}else if(a==='copy-link'){const url=location.origin+location.pathname+'?salon='+encodeURIComponent(ui.online?.room||'');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>{ui.notice='Lien d’invitation copié';render();});else{ui.notice=url;render();}}else if(a==='home')home();else if(a==='next-mission'){if(ui.mode==='online')send('continue');else{ui.game=E.continueCampaign(ui.game);ui.localVotes={};ui.localTurn=0;save();render();}}else if(a==='replay'){if(ui.mode==='online'){ui.ownVote=null;send('restart');}else newGame();}else if(a==='reset'){if(confirm('Recommencer la campagne depuis le début ?'))newGame();}});
try{const params=new URLSearchParams(location.search);const code=params.get('salon');if(code&&/^[A-Z2-9]{5}$/.test(code.toUpperCase())){ui.mode='online';ui.onlineAction='join';ui.joinCode=code.toUpperCase();}else if(hasServer){const stored=JSON.parse(localStorage.getItem(LS_ROOM)||'null');if(stored?.room&&stored?.token){ui.onlineSession=stored;ui.mode='online';}}}catch(e){}
render();if(ui.onlineSession&&hasServer)connect('resume');
})();
</script></body></html>
